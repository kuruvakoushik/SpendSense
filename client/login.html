<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · SpendSense</title>
  <link rel="icon" href="/assets/images/logo.svg">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="auth-shell">
  <main class="card auth-card">
    <a class="brand" href="/"><img src="/assets/images/logo.svg" alt=""><span class="brand-word">Spend<span>Sense</span></span></a>
    <h1>Sign in</h1>
    <p class="muted">Use the email and password you registered with.</p>
    <div id="form-error" class="alert" hidden></div>
    <form id="login-form" class="form-grid" style="grid-template-columns:1fr">
      <label class="field">Email
        <input type="email" name="email" autocomplete="email" required maxlength="254">
      </label>
      <label class="field">Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
    <p>New here? <a href="/register">Create an account</a></p>
  </main>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/auth.js"></script>
</body>
</html>
